# Example consumer workflow. Copy into your repo at
# .github/workflows/leak-guard.yml
name: Leak Guard
on: pull_request
permissions:
  contents: read
  pull-requests: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: ivosetyadi/leak-guard@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          fail-on: error
